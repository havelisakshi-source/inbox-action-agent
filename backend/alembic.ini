# Alembic configuration for the Inbox Action Agent backend.
#
# Database URL is intentionally NOT set here — it comes from
# app.core.config.settings.DATABASE_URL via alembic/env.py.
# Do not add sqlalchemy.url below.

[alembic]
# Path to the migration environment (relative to where `alembic` is invoked).
script_location = alembic

# Timestamped migration filenames, easier to order visually.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone for file_template timestamps.
timezone = UTC

# Where migration .py files are written.
version_locations = %(here)s/alembic/versions

# Separator used between revision and slug.
recursive_version_locations = false
version_path_separator = os

# Logging configuration is included in this file so `alembic` runs with
# sensible defaults out of the box.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
